server {
    listen 80;
    server_name codebg.com www.codebg.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name codebg.com www.codebg.com;

    # --- SSL (managed by Certbot) ---
    ssl_certificate     /etc/letsencrypt/live/codebg.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codebg.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # --- Security headers ---
    add_header X-Content-Type-Options  "nosniff"       always;
    add_header X-Frame-Options         "SAMEORIGIN"    always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # --- Frontend SPA ---
    root /var/www/codebg;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Vite fingerprinted assets: immutable cache ---
    location ~* /assets/.*\.[a-f0-9]{8}\.\w+$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- Customer sample sites ---
    location /customers/ {
        alias /var/www/codebg/customers/;
        try_files $uri $uri/ =404;

        location ~* /customers/.*/assets/.*\.[a-f0-9]{8}\.\w+$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    # --- samples.json ---
    location = /customers/samples.json {
        alias /var/www/codebg/customers/samples.json;
        add_header Cache-Control "no-cache";
    }

    # --- Backend API reverse proxy ---
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Backend healthz (direct access) ---
    location = /healthz {
        proxy_pass http://127.0.0.1:8787/healthz;
    }

    # --- Certbot challenge ---
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}
