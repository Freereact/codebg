server {
    listen 80;
    server_name codebg.com www.codebg.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name codebg.com www.codebg.com;

    # --- SSL (managed by Certbot) ---
    ssl_certificate     /etc/letsencrypt/live/codebg.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codebg.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # --- Security headers ---
    add_header X-Content-Type-Options  "nosniff"       always;
    add_header X-Frame-Options         "SAMEORIGIN"    always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://sample-apps.codebg.com https://challenges.cloudflare.com https://www.google-analytics.com https://region1.google-analytics.com; frame-src 'self' https://challenges.cloudflare.com https://www.google.com https://maps.google.com;" always;

    # --- Frontend SPA ---
    root /var/www/codebg;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Vite fingerprinted assets: immutable cache ---
    # Note: add_header in child blocks replaces parent headers, so we repeat security headers
    location ~* /assets/.+\-[a-zA-Z0-9]+\.(js|css|jpg|jpeg|png|webp|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options  "nosniff"       always;
        add_header X-Frame-Options         "SAMEORIGIN"    always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
        access_log off;
    }

    # --- Built project sites (preview) ---
    # ^~ prevents the regex asset location from intercepting /sites/ requests
    location ^~ /sites/ {
        root /var/www;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # --- Backend API reverse proxy ---
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Backend healthz (direct access) ---
    location = /healthz {
        proxy_pass http://127.0.0.1:8787/healthz;
    }

    # --- Certbot challenge ---
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}
