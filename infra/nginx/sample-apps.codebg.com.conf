server {
    listen 80;
    server_name sample-apps.codebg.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sample-apps.codebg.com;

    # --- SSL (managed by Certbot) ---
    ssl_certificate     /etc/letsencrypt/live/codebg.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codebg.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # --- Security headers ---
    add_header X-Content-Type-Options  "nosniff"       always;
    add_header X-Frame-Options         "SAMEORIGIN"    always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # --- CORS for main site ---
    add_header Access-Control-Allow-Origin "https://codebg.com" always;

    # --- Root ---
    root /var/www/sample-apps;
    index index.html;

    # Each /<slug>/ is a Vite SPA — fall back to its own index.html
    location ~ ^/([^/]+)/ {
        try_files $uri $uri/ /$1/index.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # --- Vite fingerprinted assets: immutable cache ---
    location ~* /assets/.+\-[a-zA-Z0-9]+\.(js|css|jpg|jpeg|png|webp|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "https://codebg.com" always;
        access_log off;
    }

    # --- samples.json: no cache ---
    location = /samples.json {
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "https://codebg.com" always;
    }

    # --- Certbot challenge ---
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}
