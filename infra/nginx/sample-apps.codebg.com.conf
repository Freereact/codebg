server {
    listen 80;
    server_name sample-apps.codebg.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sample-apps.codebg.com;

    # --- SSL (managed by Certbot) ---
    ssl_certificate     /etc/letsencrypt/live/codebg.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codebg.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # --- Security headers ---
    add_header X-Content-Type-Options  "nosniff"       always;
    add_header X-Frame-Options         "SAMEORIGIN"    always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-src https://www.google.com;" always;

    # --- CORS for main site ---
    add_header Access-Control-Allow-Origin "https://codebg.com" always;

    # --- Root ---
    root /var/www/sample-apps;
    index index.html;

    # Each /<slug>/ is a Vite SPA — fall back to its own index.html
    location ~ ^/([^/]+)/ {
        try_files $uri $uri/ /$1/index.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # --- Vite fingerprinted assets: immutable cache ---
    # Note: add_header in child blocks replaces parent headers, so we repeat security headers
    location ~* /assets/.+\-[a-zA-Z0-9]+\.(js|css|jpg|jpeg|png|webp|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "https://codebg.com" always;
        add_header X-Content-Type-Options  "nosniff"       always;
        add_header X-Frame-Options         "SAMEORIGIN"    always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
        access_log off;
    }

    # --- samples.json: no cache ---
    location = /samples.json {
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "https://codebg.com" always;
        add_header X-Content-Type-Options  "nosniff"       always;
        add_header X-Frame-Options         "SAMEORIGIN"    always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
    }

    # --- Backend API reverse proxy (for AccessGate auth check) ---
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        '';
        proxy_buffering off;
        proxy_cache off;
    }

    # --- Certbot challenge ---
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}
