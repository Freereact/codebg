name: Deploy to VM (test-ci)

on:
  push:
    branches: ["test-ci"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy build on VM
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} '
            set -e
            mkdir -p ~/projects
            if [ ! -d ~/projects/codebg/.git ]; then
              git clone git@github.com:Freereact/codebg.git ~/projects/codebg || git clone https://github.com/Freereact/codebg.git ~/projects/codebg
            fi
            cd ~/projects/codebg
            git fetch --all
            git checkout test-ci
            git pull --ff-only origin test-ci
            npm ci
            npm run build
          '
