name: Deploy to VM (test-ci)

on:
  push:
    branches: ["test-ci"]

concurrency:
  group: deploy-test-ci
  cancel-in-progress: true

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sample-apps/package-lock.json
            backend/package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Frontend lint
        run: npm run lint

      - name: Frontend format check
        run: npx prettier --check 'src/**/*.{ts,tsx}'

      - name: Frontend typecheck & build
        run: |
          node scripts/generate-fallback-samples.mjs
          npm run build

      - name: Build sample apps (all customers)
        run: |
          cd sample-apps
          npm ci
          bash build-all.sh

      - name: Install backend deps
        run: |
          cd backend
          npm ci
          npx prisma generate

      - name: Backend lint
        run: cd backend && npm run lint

      - name: Backend format check
        run: cd backend && npm run format:check

      - name: Backend tests
        run: cd backend && npm test

      - name: Backend build
        run: cd backend && npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: quality-check
    environment: test-ci
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ vars.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy frontend
        env:
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
        run: |
          set -euo pipefail
          ssh ${{ vars.VM_USER }}@${{ vars.VM_HOST }} bash -s << 'SCRIPT'
            set -euo pipefail
            cd ~/projects/codebg
            git fetch --all --prune
            git checkout -f -B test-ci origin/test-ci
            git reset --hard origin/test-ci

            # Build frontend
            npm ci
            node scripts/generate-fallback-samples.mjs
            VITE_TURNSTILE_SITE_KEY='$TURNSTILE_SITE_KEY' npm run build
            mkdir -p /var/www/codebg
            rsync -a --delete dist/ /var/www/codebg/
            rm -rf /var/www/codebg/customers/
          SCRIPT

      - name: Deploy sample apps
        run: |
          set -euo pipefail
          ssh ${{ vars.VM_USER }}@${{ vars.VM_HOST }} bash -s << 'SCRIPT'
            set -euo pipefail
            cd ~/projects/codebg/sample-apps
            npm ci
            bash build-all.sh

            # Sync each customer build to /var/www/sample-apps/<slug>/
            mkdir -p /var/www/sample-apps
            for dir in dist/*/; do
              slug=$(basename "$dir")
              mkdir -p "/var/www/sample-apps/$slug"
              rsync -a --delete "$dir" "/var/www/sample-apps/$slug/"
            done

            # Generate samples.json (with hero thumbnails from built assets)
            node generate-samples-json.mjs /var/www/sample-apps/samples.json
            cp root-index.html /var/www/sample-apps/index.html
          SCRIPT

      - name: Deploy nginx config
        run: |
          set -euo pipefail
          ssh ${{ vars.VM_USER }}@${{ vars.VM_HOST }} bash -s << 'SCRIPT'
            set -euo pipefail
            sudo rm -f /etc/nginx/sites-enabled/codebg /etc/nginx/sites-available/codebg
            sudo rm -f /etc/nginx/sites-enabled/default

            # If SSL certs don't exist yet, provision them with a temporary HTTP-only config
            if [ ! -f /etc/letsencrypt/live/test.codebg.com/fullchain.pem ]; then
              # Remove any existing SSL configs that would fail nginx -t
              sudo rm -f /etc/nginx/sites-enabled/test.codebg.com /etc/nginx/sites-enabled/test-sample-apps.codebg.com
              sudo rm -f /etc/nginx/sites-available/test.codebg.com /etc/nginx/sites-available/test-sample-apps.codebg.com
              # Temporary HTTP-only server for Certbot challenge
              printf 'server {\n  listen 80;\n  server_name test.codebg.com test-sample-apps.codebg.com;\n  root /var/www/codebg;\n  location /.well-known/acme-challenge/ { root /var/www/certbot; }\n}\n' \
                | sudo tee /etc/nginx/sites-available/temp-http > /dev/null
              sudo ln -sf /etc/nginx/sites-available/temp-http /etc/nginx/sites-enabled/temp-http
              sudo nginx -t && sudo systemctl reload nginx
              sudo certbot --nginx -d test.codebg.com -d test-sample-apps.codebg.com --expand --non-interactive --agree-tos -m hello@codebg.com
              sudo rm -f /etc/nginx/sites-enabled/temp-http /etc/nginx/sites-available/temp-http
            fi

            # Now install the full SSL configs
            sudo cp ~/projects/codebg/infra/nginx/test.codebg.com.conf /etc/nginx/sites-available/test.codebg.com
            sudo ln -sf /etc/nginx/sites-available/test.codebg.com /etc/nginx/sites-enabled/test.codebg.com
            sudo cp ~/projects/codebg/infra/nginx/test-sample-apps.codebg.com.conf /etc/nginx/sites-available/test-sample-apps.codebg.com
            sudo ln -sf /etc/nginx/sites-available/test-sample-apps.codebg.com /etc/nginx/sites-enabled/test-sample-apps.codebg.com
            sudo nginx -t
            sudo systemctl reload nginx

            # Renew certs if needed (won't re-provision, just checks expiry)
            if ! sudo certbot certificates 2>/dev/null | grep -q "test.codebg.com"; then
              sudo certbot --nginx -d test.codebg.com -d test-sample-apps.codebg.com --expand --non-interactive --agree-tos
            fi
          SCRIPT

      - name: Write backend .env
        run: |
          set -euo pipefail
          {
            echo 'PORT=8787'
            echo 'REDIS_URL=redis://codebg-redis:6379'
            echo 'RABBITMQ_URL=amqp://codebg-rabbitmq:5672'
            echo 'RABBITMQ_QUEUE=email_jobs'
            echo 'ALLOWED_ORIGINS=https://test.codebg.com'
            echo 'MAX_EMAILS_PER_DAY=100'
            printf 'TURNSTILE_SECRET_KEY=%s\n' "${{ secrets.TURNSTILE_SECRET_KEY }}"
            printf 'RESEND_API_KEY=%s\n' "${{ secrets.RESEND_API_KEY }}"
            printf 'MAIL_FROM=%s\n' "${{ vars.MAIL_FROM }}"
            printf 'MAIL_TO=%s\n' "${{ vars.MAIL_TO }}"
            printf 'DATABASE_URL=%s\n' "${{ secrets.DATABASE_URL }}"
            printf 'JWT_SECRET=%s\n' "${{ secrets.JWT_SECRET }}"
            printf 'FRONTEND_URL=%s\n' "${{ secrets.FRONTEND_URL }}"
            printf 'GH_APP_ID=%s\n' "${{ secrets.GH_APP_ID }}"
            printf 'GH_APP_PRIVATE_KEY=%s\n' "${{ secrets.GH_APP_PRIVATE_KEY }}"
            printf 'GH_APP_INSTALLATION_ID=%s\n' "${{ secrets.GH_APP_INSTALLATION_ID }}"
            printf 'GH_WEBHOOK_SECRET=%s\n' "${{ secrets.GH_WEBHOOK_SECRET }}"
            echo 'GH_ORG=codebg-team'
            echo 'SAMPLE_APPS_DIR=/mnt/sample-apps'
            echo 'DATABASE_SSL_REJECT_UNAUTHORIZED=false'
            printf 'STRIPE_SECRET_KEY=%s\n' "${{ secrets.STRIPE_SECRET_KEY }}"
            printf 'STRIPE_WEBHOOK_SECRET=%s\n' "${{ secrets.STRIPE_WEBHOOK_SIGNING_SECRET }}"
            printf 'STRIPE_PRICE_STARTER_MONTHLY=%s\n' "${{ secrets.STRIPE_PRICE_STARTER_MONTHLY }}"
            printf 'STRIPE_PRICE_PROFESSIONAL_MONTHLY=%s\n' "${{ secrets.STRIPE_PRICE_PROFESSIONAL_MONTHLY }}"
          } | ssh -o StrictHostKeyChecking=no ${{ vars.VM_USER }}@${{ vars.VM_HOST }} "cat > ~/projects/codebg/backend/.env && chmod 600 ~/projects/codebg/backend/.env"

      - name: Ensure project directories
        run: |
          ssh -o StrictHostKeyChecking=no ${{ vars.VM_USER }}@${{ vars.VM_HOST }} bash -s << 'SCRIPT'
            set -euo pipefail
            mkdir -p /var/www/projects /var/www/sites
            chown 1000:1000 /var/www/projects /var/www/sites
          SCRIPT

      - name: Deploy backend
        run: |
          set -euo pipefail
          ssh ${{ vars.VM_USER }}@${{ vars.VM_HOST }} bash -s << 'SCRIPT'
            set -euo pipefail
            cd ~/projects/codebg/backend
            # Set host-specific docker-compose overrides for DigitalOcean
            export SAMPLE_APPS_HOST_PATH=/root/projects/codebg/sample-apps
            export DNS_SERVER_1=67.207.67.2
            export DNS_SERVER_2=67.207.67.3
            # Build and start services (prisma generate runs inside Docker build)
            sudo docker compose up -d --build --wait
          SCRIPT

      - name: Verify deployment
        run: |
          set -euo pipefail
          ssh ${{ vars.VM_USER }}@${{ vars.VM_HOST }} bash -s << 'SCRIPT'
            set -euo pipefail
            # Verify API health
            curl -fsS http://127.0.0.1:8787/healthz
            echo ""
            echo "Deployment verified successfully."
          SCRIPT
