name: Deploy to VM (test-ci)

on:
  push:
    branches: ["test-ci"]

concurrency:
  group: deploy-test-ci
  cancel-in-progress: true

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sample-apps/package-lock.json
            backend/package-lock.json

      - name: Build frontend
        run: npm ci && npm run build

      - name: Build sample apps (all customers)
        run: |
          cd sample-apps
          npm ci
          bash build-all.sh

      - name: Test & build backend
        run: |
          cd backend
          npm ci
          npm test
          npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: quality-check
    environment: test-ci
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy frontend
        env:
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
        run: |
          set -euo pipefail
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} bash -s << 'SCRIPT'
            set -euo pipefail
            cd ~/projects/codebg
            git fetch --all --prune
            git checkout -B test-ci origin/test-ci
            git reset --hard origin/test-ci

            # Build frontend
            npm ci
            VITE_TURNSTILE_SITE_KEY='$TURNSTILE_SITE_KEY' npm run build
            mkdir -p /var/www/codebg
            rsync -a --delete dist/ /var/www/codebg/
          SCRIPT

      - name: Deploy sample apps
        run: |
          set -euo pipefail
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} bash -s << 'SCRIPT'
            set -euo pipefail
            cd ~/projects/codebg/sample-apps
            npm ci
            bash build-all.sh

            # Sync each customer build to /var/www/sample-apps/<slug>/
            mkdir -p /var/www/sample-apps
            for dir in dist/*/; do
              slug=$(basename "$dir")
              mkdir -p "/var/www/sample-apps/$slug"
              rsync -a --delete "$dir" "/var/www/sample-apps/$slug/"
            done

            # Generate samples.json from meta.json files
            echo '[' > /tmp/samples.json
            first=true
            for meta in src/customers/*/meta.json; do
              if [ "$first" = true ]; then first=false; else echo ',' >> /tmp/samples.json; fi
              cat "$meta" >> /tmp/samples.json
            done
            echo ']' >> /tmp/samples.json
            cp /tmp/samples.json /var/www/sample-apps/samples.json
          SCRIPT

      - name: Deploy nginx config
        run: |
          set -euo pipefail
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} bash -s << 'SCRIPT'
            set -euo pipefail
            sudo cp ~/projects/codebg/infra/nginx/codebg.com.conf /etc/nginx/sites-available/codebg.com
            sudo ln -sf /etc/nginx/sites-available/codebg.com /etc/nginx/sites-enabled/codebg.com
            sudo cp ~/projects/codebg/infra/nginx/sample-apps.codebg.com.conf /etc/nginx/sites-available/sample-apps.codebg.com
            sudo ln -sf /etc/nginx/sites-available/sample-apps.codebg.com /etc/nginx/sites-enabled/sample-apps.codebg.com
            sudo nginx -t
            sudo systemctl reload nginx
            sudo certbot --nginx -d codebg.com -d www.codebg.com -d sample-apps.codebg.com --expand --non-interactive --agree-tos
          SCRIPT

      - name: Deploy backend
        env:
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          set -euo pipefail
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} bash -s << SCRIPT
            set -euo pipefail
            cd ~/projects/codebg/backend

            # Write .env for docker compose
            cat > .env << EOF
          PORT=8787
          REDIS_URL=redis://codebg-redis:6379
          RABBITMQ_URL=amqp://codebg-rabbitmq:5672
          RABBITMQ_QUEUE=email_jobs
          TURNSTILE_SECRET_KEY=$TURNSTILE_SECRET_KEY
          RESEND_API_KEY=$RESEND_API_KEY
          MAIL_FROM=$MAIL_FROM
          MAIL_TO=$MAIL_TO
          ALLOWED_ORIGINS=https://codebg.com
          MAX_EMAILS_PER_DAY=100
          EOF

            # Build and start services
            sudo docker compose up -d --build --wait
          SCRIPT

      - name: Verify deployment
        run: |
          set -euo pipefail
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} bash -s << 'SCRIPT'
            set -euo pipefail
            # Verify API health
            curl -fsS http://127.0.0.1:8787/healthz
            echo ""
            echo "Deployment verified successfully."
          SCRIPT
