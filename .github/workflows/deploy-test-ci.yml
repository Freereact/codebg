name: Deploy to VM (test-ci)

on:
  push:
    branches: ["test-ci"]

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Frontend build check
        run: |
          npm install
          npm run build

      - name: Backend test + build check
        run: |
          cd backend
          npm install
          npm test
          npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: quality-check
    environment: test-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy build on VM
        env:
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          if [ -z "$TURNSTILE_SITE_KEY" ]; then
            echo "Missing TURNSTILE_SITE_KEY in test-ci secrets"
            exit 1
          fi
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} "
            set -e
            mkdir -p ~/projects
            if [ ! -d ~/projects/codebg/.git ]; then
              git clone git@github.com:Freereact/codebg.git ~/projects/codebg || git clone https://github.com/Freereact/codebg.git ~/projects/codebg
            fi
            cd ~/projects/codebg
            git remote prune origin || true
            git fetch --all --prune
            git checkout -B test-ci origin/test-ci
            git reset --hard origin/test-ci
            rm -rf node_modules
            npm install
            export VITE_TURNSTILE_SITE_KEY='$TURNSTILE_SITE_KEY'
            echo 'VITE_TURNSTILE_SITE_KEY=$TURNSTILE_SITE_KEY' > .env.production
            npm run build
            mkdir -p /var/www/codebg
            rsync -a --delete --exclude='customers/' dist/ /var/www/codebg/
            systemctl reload nginx || nginx -s reload
          "
